# 問譜 v3（2026-08-12 推倒重立，覆蓋部署於同名 worker——路由、KV、遊戲側 service binding 皆不動）。
# 舊管線（M5.1 八路收兩層）之碼與評測 git 可考；此名沿用即是「覆蓋舊問」的落點。
name = "xuanfopu-agent-v2"
main = "src/index.js"
compatibility_date = "2026-01-01"
# 加 routes 後 workers.dev 會被自動停用，故顯式保留——
# 它是不經 foyue.org 的直訪備路，出事時可繞開路由排查。
# 公網直訪（含此備路）一律零生成：密鑰不入 env，答語降級為檢得原文直出——
# 詳 src/guard.js。故留著不燒錢。
workers_dev = true

# 對外正式路由：foyue.org/xuanfopu/ask/api
# 較 bojingtai 之 foyue.org/* 更具體，Cloudflare 按特異性匹配，故優先而不奪其餘路徑。
[[routes]]
pattern = "foyue.org/xuanfopu/ask/api"
zone_name = "foyue.org"

[observability]
enabled = true

# 據文生成之模型（compose.js）。改此一行即切，不必動碼；缺此項則取碼中默認（同值）。
# 【選型實測 2026-08-04】同一問句、流式、關思考，ttft：
#   V4-Pro 1.6s ｜ V3.2 4.1s ｜ V4-Flash 97.1s / 92.3s / 34.2s
# 名為 Flash 者反最慢（新模型容量未跟上，隊列最擠），而前端 abort 為 45s，
# 三次有二次逕超時。故取 Pro。換模型後須重跑 player-eval --model，看 ttft 與丟句數。
[vars]
COMPOSE_MODEL = "deepseek-ai/DeepSeek-V4-Pro"
# 生成路每客戶端日配額（鍵＝前端側 x-ask-client 指紋）。額滿降級原文直出，不拒答。
# 【問譜 v3，2026-08-12】意圖層（INTENT_MODEL）與問文庫旁路（WENKU_SERVICE）隨舊管線撤除：
# 新管線只一條「檢索→據文生成」路，無意圖可分；譜外之問據實說材料答不了，不轉他家。
ASK_GEN_DAILY = "60"

# 限流與答案快取（2026-08-04 P1 兌現，詳 src/guard.js 與 compose.js 快取段）。
# 鍵形：rl:<client>:<日> 配額計數（27h 自清）；ans:<模型>:<鍵> 已過閘答案（7 日，鍵含數據版次）。
# 帳號裡另有一個名為「RL」的舊命名空間，係舊 worker（xuanfopu-evidence-agent）之限額存儲，勿混用。
[[kv_namespaces]]
binding = "RL"
id = "05494f9543cd40b9bf876418fc46bf0a"   # title: xuanfopu-agent-rl
